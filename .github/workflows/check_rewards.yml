name: Check Cruise Rewards

on:
  schedule:
    # Runs every 15 minutes between 15:00 UTC and 22:00 UTC (8 AM - 3 PM Pacific)
    - cron: '*/15 15-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit Updated Rewards Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rewards_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update rewards cache [skip ci]" && git push)
